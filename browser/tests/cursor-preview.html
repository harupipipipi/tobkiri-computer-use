<!doctype html>
<html lang="ja">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tobkiri Tabs · Cursor validation</title>
<link rel="icon" href="/extension/assets/icons/icon-32.png">
<style>
  *{box-sizing:border-box}body{margin:0;background:#f3f5f8;color:#172231;font:15px/1.6 system-ui,sans-serif}
  header{display:flex;align-items:center;gap:14px;background:#142333;color:white;padding:24px 36px}
  header img{width:48px;height:48px;border-radius:12px}h1{font-size:23px;margin:0}header p{margin:2px 0 0;color:#b5c5d8;font-size:13px}
  main{max-width:980px;margin:30px auto;padding:0 28px}h2{font-size:17px;margin:0 0 12px}.panel{background:white;border:1px solid #dbe1e8;border-radius:14px;padding:24px;margin-bottom:20px}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}button,input{font:inherit;border:1px solid #cad2dd;border-radius:8px;padding:8px 13px}button{cursor:pointer;background:white}button:hover{background:#eaf0f8}
  .primary{background:#245ce5;color:white;border-color:#245ce5}.primary:hover{background:#1949bf}
  #stage{position:relative;display:flex;gap:22px;align-items:center;justify-content:center;height:240px;background:#eef3ff;border:1px dashed #a0b4df;border-radius:10px}
  #target{background:#17324e;color:white;padding:18px 28px}#count{font-size:28px;font-weight:700;min-width:50px}#entry{width:100%}
  .note{font-size:13px;color:#607086;margin:14px 0 0}#stage.dark{background:#142333;color:white}#stage.dark button{background:#2b425b;color:white}
  #report{white-space:pre-wrap;margin:0;font:13px/1.8 ui-monospace,monospace}#scroller{height:90px;overflow:auto;border:1px solid #cad2dd;margin-top:12px}#scroller div{height:450px;background:linear-gradient(#e6efff,#b6d5c8)}
</style>
<header><img src="/extension/assets/brand.png" alt=""><div><h1>Tobkiri Tabs</h1><p>カーソル描画の検証ページ · Lucide mouse-pointer-2</p></div></header>
<main>
  <section class="panel"><h2>移動・クリック・ドラッグ</h2>
    <div class="toolbar"><button id="move" class="primary">移動を表示</button><button id="click">クリックを表示</button><button id="drag">ドラッグを表示</button><button id="edge">四隅を確認</button><button id="contrast">背景を切り替え</button><button id="hide">カーソルを消す</button></div>
    <label class="note"><input id="hold" type="checkbox"> スクリーンショット確認用に表示を保持（60秒）</label>
    <div id="stage"><button id="target">クリック対象</button><span id="count">0</span></div>
    <p class="note">本番の描画コードをそのまま使用。青い矢印の先端がCSS座標に一致し、表示がクリックを遮らないことを確認します。</p>
  </section>
  <section class="panel"><h2>入力・スクロール</h2><label for="entry">テスト用入力欄</label><input id="entry" value="local fixture"><div class="toolbar" style="margin:12px 0 0"><button id="type">入力位置を表示</button><button id="scroll">スクロール位置を表示</button></div><div id="scroller"><div>スクロールコンテナ</div></div></section>
  <section class="panel"><div class="toolbar"><button id="checks" class="primary">描画チェックを実行</button><a href="/popup">設定画面のプレビュー</a></div><pre id="report">チェック待ち</pre><p class="note">このページは描画用のDOMテストです。拡張のインストールやMCP接続を検証する通しテストとは別です。</p></section>
</main>
<script type="module" src="/tests/cursor-preview.mjs"></script>
</html>
