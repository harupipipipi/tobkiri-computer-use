<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>こもれび — 架空のSNS</title>
  <style>
    :root{color-scheme:light;--ink:#1d3633;--muted:#7c8c87;--green:#26765f;--line:#e6ece7;--paper:#fff;--soft:#f5f7f3}
    *{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.65 "Yu Gothic UI","Meiryo",sans-serif}button,a{ -webkit-tap-highlight-color:transparent }button{font:inherit;cursor:pointer}button:disabled{cursor:wait;opacity:.5}button:focus-visible,a:focus-visible{outline:3px solid #b3d7ca;outline-offset:4px}a{color:inherit;text-decoration:none}svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .shell{max-width:1200px;margin:auto;display:grid;grid-template-columns:225px minmax(0,600px) 300px;gap:24px;padding:28px 22px}.sidebar{position:sticky;top:28px;height:calc(100vh - 56px);display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-size:25px;font-weight:800;letter-spacing:2px;padding:10px 13px 32px}.brand-mark{display:grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--green);color:white;font-size:28px}.nav-item{display:flex;gap:15px;align-items:center;padding:14px 17px;margin-bottom:7px;border-radius:14px;font-size:16px;font-weight:600}.nav-item.active{background:#e5eee6;color:var(--green)}.nav-item svg{width:24px;height:24px}.new-post{border:0;border-radius:50px;background:var(--green);color:white;margin:24px 11px;padding:13px;font-weight:700}.side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:21px 13px 10px}.viewer{display:flex;align-items:center;gap:11px}.tiny{font-size:11px;color:var(--muted)}.sub{color:var(--muted);font-size:12px}.title{margin:1px 0 3px;font-size:24px;letter-spacing:-.7px}.intro{font-size:12px;color:var(--muted);margin:0 0 23px}.badge{font-size:11px;font-weight:700;letter-spacing:1px;background:#e5eee5;color:#457354;border:1px solid #d8e4d8;border-radius:6px;padding:3px 7px}
    .feed{background:white;border:1px solid var(--line);border-radius:20px;overflow:hidden}.tabs{display:flex;gap:27px;padding:0 25px;border-bottom:1px solid var(--line)}.tab{padding:19px 3px 16px;position:relative;font-weight:700;color:var(--muted)}.tab.active{color:var(--green)}.tab.active:after{content:"";height:3px;position:absolute;bottom:0;left:0;right:0;background:var(--green);border-radius:5px}
    .composer{display:flex;gap:13px;padding:24px;border-bottom:1px solid var(--line)}.composer-body{flex:1}.compose-placeholder{margin:5px 0 21px;color:#8d9893;font-size:15px}.compose-footer{display:flex;justify-content:space-between;align-items:center;color:#87a293}.compose-tools{display:flex;gap:16px}.pill{padding:7px 19px;border:0;background:#e9f0e9;border-radius:30px;font-weight:700;color:#789180}.avatar{display:grid;place-items:center;width:42px;height:42px;border-radius:50%;font-weight:700;flex-shrink:0;background:#e8eddf;color:#557046}.avatar.purple{background:#e8e3f3;color:#84729f}.avatar.orange{background:#f7e6d6;color:#b07d58}.avatar.green{background:#e1eedc;color:#7b9970}
    .post{padding:23px 24px 18px;border-bottom:1px solid var(--line)}.post:last-child{border-bottom:0}.post-head{display:flex;align-items:center;gap:11px}.post-meta{flex:1}.name{font-weight:700;font-size:14px}.handle{font-size:12px;color:var(--muted);margin-left:7px}.more{font-size:20px;color:#9baba2}.post-content{padding-left:53px}.post-text{white-space:pre-line;margin:12px 0 17px;font-size:14px;line-height:1.95}.landscape{height:174px;border-radius:13px;position:relative;overflow:hidden;background:linear-gradient(#dce9d8,#eef0d9 59%,#a0b397 60%);margin-bottom:15px}.sun{position:absolute;top:25px;right:70px;width:39px;height:39px;border-radius:50%;background:#fff7d4;box-shadow:0 0 60px 20px #fff4cd77}.hill{position:absolute;bottom:-95px;width:580px;height:180px;border-radius:50%;background:#718d71;left:-170px;transform:rotate(-10deg)}.hill.far{background:#aec2a1;left:0;bottom:-53px;transform:rotate(14deg)}.tree{position:absolute;bottom:0;left:76px;width:8px;height:120px;background:#527565;transform:rotate(-2deg)}.tree:before,.tree:after{content:"";position:absolute;width:100px;height:70px;border-radius:50%;background:#477659;left:-52px;top:-17px}.tree:after{left:-22px;top:13px;width:87px;height:67px;background:#5f8861}.caption{position:absolute;bottom:14px;right:18px;letter-spacing:3px;color:#f5f9ef;font-size:10px}.actions{display:flex;align-items:center;gap:27px}.action{display:flex;gap:7px;align-items:center;background:transparent;border:0;padding:6px 0;color:#82958a;font-size:12px;min-width:46px}.action.like[aria-pressed=true]{color:#d47984}.action.like[aria-pressed=true] svg{fill:#d47984;stroke:#d47984}.action.save{margin-left:auto;min-width:21px}.follow{border:1px solid #d0ded1;border-radius:30px;background:white;color:var(--green);font-size:11px;font-weight:700;padding:6px 13px}.follow[aria-pressed=true]{background:#e8f0e8;border-color:#e8f0e8;color:#527762}
    .right{padding-top:8px}.search{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:30px;color:#91a197;padding:12px 16px;background:white;font-size:12px;margin-bottom:22px}.card{background:white;border:1px solid var(--line);border-radius:18px;margin-bottom:17px;padding:21px 18px}.card h2{margin:0 0 17px;font-size:14px}.suggestion{display:flex;gap:9px;align-items:center;margin:17px 0}.suggestion .avatar{width:34px;height:34px;font-size:12px}.suggestion-info{flex:1}.suggestion .name{font-size:12px}.suggestion .sub{font-size:10px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 0 17px}.stat{border-radius:10px;background:#f3f6f1;text-align:center;padding:12px 3px}.stat strong{display:block;font-size:23px;font-weight:700;color:var(--green)}.stat span{font-size:10px;color:var(--muted)}.activity{list-style:none;margin:0;padding:0}.activity li{font-size:11px;padding:9px 0;border-bottom:1px solid #f0f3ee;display:flex;gap:8px;align-items:center}.activity li:last-child{border:0}.activity-dot{width:5px;height:5px;border-radius:50%;background:#8aac95;flex-shrink:0}.demo-note{font-size:11px;color:var(--muted);line-height:1.9}.demo-note strong{color:#577562}.footer{font-size:10px;color:#9aa69f;padding:0 8px}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#224a3b;color:white;padding:11px 22px;border-radius:12px;z-index:10;font-size:12px;box-shadow:0 5px 25px #25452e22}.empty{font-size:11px;color:var(--muted)}
    @media(max-width:1050px){.shell{grid-template-columns:185px minmax(0,600px);justify-content:center}.right{display:none}.brand{font-size:21px}}@media(max-width:650px){.shell{display:block;padding:18px 12px}.sidebar{height:auto;position:static}.brand{padding:0 5px 18px}.sidebar nav,.new-post,.side-bottom{display:none}.intro{margin-bottom:14px}.post{padding:18px 15px}.composer{padding:18px 15px}.post-content{padding-left:0}}
  </style>
</head>
<body>
<div class="shell">
  <aside class="sidebar"><a class="brand" href="/" aria-label="こもれび ホーム"><span class="brand-mark">✳</span>こもれび</a><nav aria-label="メインメニュー"><a class="nav-item active" href="#feed"><span data-icon="home"></span>ホーム</a><span class="nav-item"><span data-icon="compass"></span>見つける</span><span class="nav-item"><span data-icon="bell"></span>通知</span><span class="nav-item"><span data-icon="user"></span>プロフィール</span></nav><div class="new-post" aria-hidden="true" style="text-align:center">今日をつづる</div><div class="side-bottom"><div class="viewer"><div class="avatar">T</div><div><strong>とびきり</strong><div class="sub">@tobkiri</div></div></div><p class="tiny">LOCAL DEMO · 架空のアカウント</p></div></aside>
  <main><div style="display:flex;align-items:center;justify-content:space-between"><h1 class="title">今日のこもれび</h1><span class="badge">LOCAL DEMO</span></div><p class="intro">好きな景色と、小さなつながり。</p><section class="feed" id="feed"><div class="tabs"><span class="tab active">おすすめ</span><span class="tab">フォロー中</span></div><div class="composer"><div class="avatar">T</div><div class="composer-body"><p class="compose-placeholder">今日は、どんな発見があった？</p><div class="compose-footer"><span class="compose-tools"><span data-icon="image"></span><span data-icon="smile"></span></span><span class="pill">投稿する</span></div></div></div><div id="posts" aria-label="投稿一覧"></div></section></main>
  <aside class="right"><div class="search"><span data-icon="search"></span>こもれびを探す</div><section class="card"><h2>気になる人を見つけよう</h2><div id="suggestions"></div></section><section class="card"><h2>あなたのつながり</h2><div class="stats"><div class="stat"><strong id="following-count">0</strong><span>フォロー中</span></div><div class="stat"><strong id="liked-count">0</strong><span>いいねした投稿</span></div></div><ul class="activity" id="activity" aria-label="操作履歴"></ul></section><section class="card demo-note"><strong>ここは架空のSNSです。</strong><br>フォロー・いいねは、このPCのローカルデモに保存されます。すべての人物と投稿は架空です。</section><p class="footer">こもれび © 2026 · ローカルで、小さく。</p></aside>
</div><div id="toast" class="toast" role="status" hidden></div>
<script>
const paths={home:'M3 10 12 3l9 7v10H3z M9 20v-7h6v7',compass:'M9 9l7-3-3 7-7 3z M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20',bell:'M6 8a6 6 0 0 1 12 0v7l2 3H4l2-3z M10 21h4',user:'M8 7a4 4 0 1 0 8 0 4 4 0 0 0-8 0 M4 21v-3a8 8 0 0 1 16 0v3',heart:'M20 5a5 5 0 0 0-8 1 5 5 0 0 0-8-1C0 10 6 16 12 21c6-5 12-11 8-16z',reply:'M21 11a9 9 0 0 1-9 9H4l-2 2v-11a9 9 0 0 1 19 0',share:'M5 12h14 M14 7l5 5-5 5',save:'M6 3h12v18l-6-4-6 4z',image:'M3 3h18v18H3z M3 16l6-6 5 5 3-3 4 4 M15 7h1',smile:'M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20 M7 14q5 6 10 0 M8 8h.1 M16 8h.1',search:'M10 3a7 7 0 1 0 0 14 7 7 0 0 0 0-14 M16 16l5 5'};
const icon=name=>`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="${paths[name]}"></path></svg>`;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state,toastTimer;const busy=new Set();
function render(){
 document.getElementById('posts').innerHTML=state.posts.map(p=>{const u=state.users.find(u=>u.id===p.userId);return `<article class="post" data-post="${p.id}"><header class="post-head"><div class="avatar ${u.color}">${u.avatar}</div><div class="post-meta"><span class="name">${u.name}</span><span class="handle">@${u.handle} · ${p.time}</span></div><span class="more" aria-hidden="true">···</span></header><div class="post-content"><p class="post-text">${esc(p.text)}</p>${p.art?'<div class="landscape" role="img" aria-label="架空の朝の風景イラスト"><div class="sun"></div><div class="hill far"></div><div class="hill"></div><div class="tree"></div><span class="caption">A QUIET MORNING</span></div>':''}<div class="actions"><span class="action" aria-label="返信 ${p.replies}件">${icon('reply')}${p.replies}</span><span class="action" aria-hidden="true">${icon('share')}2</span><button class="action like" data-kind="like" data-id="${p.id}" aria-label="${u.name}の投稿${p.liked?'のいいねを取り消す':'にいいね'}" aria-pressed="${p.liked}">${icon('heart')}<span data-like-count="${p.id}">${p.likes}</span></button><span class="action save" aria-hidden="true">${icon('save')}</span></div></div></article>`}).join('');
 document.getElementById('suggestions').innerHTML=state.users.map(u=>`<div class="suggestion"><div class="avatar ${u.color}">${u.avatar}</div><div class="suggestion-info"><div class="name">${u.name}</div><div class="sub">@${u.handle}</div></div><button class="follow" data-kind="follow" data-id="${u.id}" aria-label="${u.name}${u.following?'のフォローを解除':'をフォロー'}" aria-pressed="${u.following}">${u.following?'フォロー中':'フォロー'}</button></div>`).join('');
 document.getElementById('following-count').textContent=state.users.filter(u=>u.following).length;
 document.getElementById('liked-count').textContent=state.posts.filter(p=>p.liked).length;
 document.getElementById('activity').innerHTML=state.activity.slice(-5).reverse().map(a=>{const u=state.users.find(u=>u.id===(a.kind==='follow'?a.id:state.posts.find(p=>p.id===a.id).userId));return `<li><span class="activity-dot"></span>${u.name}${a.kind==='follow'?(a.enabled?'をフォローしました':'のフォローを解除しました'):(a.enabled?'の投稿にいいねしました':'のいいねを取り消しました')}</li>`}).join('')||'<li class="empty">気になる投稿から、はじめよう。</li>';
 document.querySelectorAll('button[data-kind]').forEach(b=>b.disabled=busy.has(`${b.dataset.kind}/${b.dataset.id}`));
}
document.addEventListener('click',async event=>{
 const button=event.target.closest('button[data-kind]');if(!button||button.disabled)return;
 const {kind,id}=button.dataset,key=`${kind}/${id}`;if(busy.has(key))return;
 const record=(kind==='follow'?state.users:state.posts).find(r=>r.id===id),enabled=!record[kind==='follow'?'following':'liked'];
 busy.add(key);button.disabled=true;
 try{const response=await fetch(`/api/${key}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({enabled,trusted:event.isTrusted})});if(!response.ok)throw Error('保存できませんでした');state=await response.json();busy.delete(key);render();const toast=document.getElementById('toast');toast.textContent=enabled?(kind==='follow'?'フォローしました':'いいねしました'):'取り消しました';toast.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.hidden=true,1900);}
 catch(e){busy.delete(key);button.disabled=false;const toast=document.getElementById('toast');toast.textContent=e.message+'。状態を確認してください。';toast.hidden=false;}
});
(async()=>{try{const response=await fetch('/api/state');if(!response.ok)throw Error();state=await response.json();render();document.documentElement.dataset.ready='true';}catch{document.getElementById('posts').textContent='ローカルデモに接続できませんでした。';}})();
</script>
</body>
</html>
